<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN Image Processing - AR TLM</title>

    <!-- A-Frame (v1.3.0 for enhanced AR.js stability) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- AR.js CDN (Stable Build) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #title {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 92%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.78);
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
        }

        #instruction {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.92);
            color: black;
            padding: 9px;
            border-radius: 20px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="title">
        <b>IMAGE PROCESSING USING CNN</b><br>
        Augmented Reality Teaching Model
    </div>

    <div id="instruction">
        Point your camera at the <b>Hiro marker</b>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: true; logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- HIRO MARKER -->
        <a-marker preset="hiro">

            <!-- MAIN TITLE -->
            <a-text value="CNN IMAGE PROCESSING" position="0 2.4 0" rotation="-90 0 0" align="center" width="5" color="#FFFFFF"></a-text>

            <!-- STEP 1 : INPUT IMAGE -->
            <a-text value="1. INPUT IMAGE" position="-3 1.8 0" rotation="-90 0 0" align="center" width="3" color="#00FFFF"></a-text>
            <a-plane position="-3 0.9 0" rotation="-90 0 0" width="1.8" height="1.8" color="#222222"></a-plane>
            
            <a-entity id="inputPixels">
                <!-- Row 1 -->
                <a-box position="-3.6 1.4 0.03" width="0.45" height="0.45" depth="0.04" color="#FFFFFF"></a-box>
                <a-box position="-3.15 1.4 0.03" width="0.45" height="0.45" depth="0.04" color="#AAAAAA"></a-box>
                <a-box position="-2.7 1.4 0.03" width="0.45" height="0.45" depth="0.04" color="#555555"></a-box>

                <!-- Row 2 -->
                <a-box position="-3.6 0.95 0.03" width="0.45" height="0.45" depth="0.04" color="#CCCCCC"></a-box>
                <a-box position="-3.15 0.95 0.03" width="0.45" height="0.45" depth="0.04" color="#FFFFFF"></a-box>
                <a-box position="-2.7 0.95 0.03" width="0.45" height="0.45" depth="0.04" color="#777777"></a-box>

                <!-- Row 3 -->
                <a-box position="-3.6 0.5 0.03" width="0.45" height="0.45" depth="0.04" color="#444444"></a-box>
                <a-box position="-3.15 0.5 0.03" width="0.45" height="0.45" depth="0.04" color="#999999"></a-box>
                <a-box position="-2.7 0.5 0.03" width="0.45" height="0.45" depth="0.04" color="#FFFFFF"></a-box>
            </a-entity>
            <a-text value="Image = pixels" position="-3 0.1 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>

            <!-- STEP 2 : PREPROCESSING -->
            <a-text value="2. PRE-PROCESSING" position="-1 1.8 0" rotation="-90 0 0" align="center" width="3" color="#FFD700"></a-text>
            <a-box position="-1 0.95 0" width="1.5" height="1.5" depth="0.12" color="#444444"></a-box>
            <a-text value="Resize" position="-1 1.3 0.08" rotation="-90 0 0" align="center" width="1.5" color="#FFFFFF"></a-text>
            <a-text value="Normalize" position="-1 0.85 0.08" rotation="-90 0 0" align="center" width="1.5" color="#FFFFFF"></a-text>
            <a-text value="Remove noise" position="-1 0.4 0.08" rotation="-90 0 0" align="center" width="1.5" color="#FFFFFF"></a-text>

            <!-- STEP 3 : CONVOLUTION -->
            <a-text value="3. CONVOLUTION" position="1.2 1.8 0" rotation="-90 0 0" align="center" width="3" color="#FF66CC"></a-text>
            <a-plane position="0.6 0.9 0" rotation="-90 0 0" width="1.5" height="1.5" color="#333333"></a-plane>
            <a-plane position="1.8 0.9 0.08" rotation="-90 0 0" width="0.9" height="0.9" color="#FF3366"
                     animation="property: position; from: 1.8 1.35 0.08; to: 1.8 0.45 0.08; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine;"></a-plane>
            <a-text value="3 x 3 KERNEL" position="1.8 0.05 0" rotation="-90 0 0" align="center" width="1.8" color="#FF3366"></a-text>
            <a-text value="1  0  -1&#10;1  0  -1&#10;1  0  -1" position="1.8 0.9 0.15" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>

            <!-- STEP 4 : FEATURE MAP -->
            <a-text value="4. FEATURE MAP" position="3.3 1.8 0" rotation="-90 0 0" align="center" width="3" color="#00FF88"></a-text>
            <a-plane position="3.3 0.9 0" rotation="-90 0 0" width="1.5" height="1.5" color="#003322"></a-plane>
            <a-box position="2.95 1.3 0.08" width="0.35" height="0.35" depth="0.05" color="#00FF88"></a-box>
            <a-box position="3.3 1.3 0.08" width="0.35" height="0.35" depth="0.05" color="#00FF88"></a-box>
            <a-box position="3.65 1.3 0.08" width="0.35" height="0.35" depth="0.05" color="#003322"></a-box>
            <a-box position="2.95 0.95 0.08" width="0.35" height="0.35" depth="0.05" color="#00FF88"></a-box>
            <a-box position="3.3 0.95 0.08" width="0.35" height="0.35" depth="0.05" color="#003322"></a-box>
            <a-box position="3.65 0.95 0.08" width="0.35" height="0.35" depth="0.05" color="#003322"></a-box>
            <a-text value="Edges / patterns" position="3.3 0.1 0" rotation="-90 0 0" align="center" width="2" color="#00FF88"></a-text>

            <!-- STEP 5 : POOLING -->
            <a-text value="5. POOLING" position="5.3 1.8 0" rotation="-90 0 0" align="center" width="2.7" color="#FFA500"></a-text>
            <a-plane position="5.3 0.95 0" rotation="-90 0 0" width="1.5" height="1.5" color="#442200"></a-plane>
            <a-text value="MAX&#10;POOL" position="5.3 0.95 0.1" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
            <a-text value="Smaller feature map" position="5.3 0.1 0" rotation="-90 0 0" align="center" width="2.2" color="#FFA500"></a-text>

            <!-- STEP 6 : FLATTEN -->
            <a-text value="6. FLATTEN" position="7.1 1.8 0" rotation="-90 0 0" align="center" width="2.5" color="#BB88FF"></a-text>
            <a-box position="6.6 0.95 0" width="0.6" height="1.2" depth="0.12" color="#553388"></a-box>
            <a-box position="7.6 0.95 0" width="0.25" height="1.5" depth="0.15" color="#BB88FF"
                   animation="property: rotation; to: 0 0 360; loop: true; dur: 3000; easing: linear;"></a-box>
            <a-text value="[0.2, 0.8, 0.1, 0.6...]" position="7.1 0.1 0" rotation="-90 0 0" align="center" width="2.5" color="#BB88FF"></a-text>

            <!-- STEP 7 : CNN CLASSIFIER -->
            <a-text value="7. CNN CLASSIFIER" position="9.2 1.8 0" rotation="-90 0 0" align="center" width="3" color="#FFFFFF"></a-text>
            <a-sphere position="8.7 1.15 0" radius="0.16" color="#FFFFFF"></a-sphere>
            <a-sphere position="8.7 0.65 0" radius="0.16" color="#FFFFFF"></a-sphere>
            <a-sphere position="9.4 1.15 0" radius="0.16" color="#FFFFFF"></a-sphere>
            <a-sphere position="9.4 0.65 0" radius="0.16" color="#FFFFFF"></a-sphere>

            <a-entity line="start: 8.7 1.15 0; end: 9.4 1.15 0; color: #FFFFFF"></a-entity>
            <a-entity line="start: 8.7 1.15 0; end: 9.4 0.65 0; color: #FFFFFF"></a-entity>
            <a-entity line="start: 8.7 0.65 0; end: 9.4 1.15 0; color: #FFFFFF"></a-entity>
            <a-entity line="start: 8.7 0.65 0; end: 9.4 0.65 0; color: #FFFFFF"></a-entity>

            <!-- STEP 8 : FINAL CLASSIFICATION -->
            <a-text value="8. CLASSIFICATION" position="10.8 1.8 0" rotation="-90 0 0" align="center" width="3" color="#00FFFF"></a-text>
            <a-cylinder position="10.8 0.9 0" radius="0.65" height="0.15" rotation="90 0 0" color="#00AAFF"
                        animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000;"></a-cylinder>
            <a-text value="CAT  92%" position="10.8 0.9 0.12" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
            <a-text value="Prediction" position="10.8 0.1 0" rotation="-90 0 0" align="center" width="2" color="#00FFFF"></a-text>

            <!-- ARROWS BETWEEN STEPS -->
            <a-text value="→" position="-2 0.95 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
            <a-text value="→" position="0 0.95 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
            <a-text value="→" position="2.4 0.95 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
            <a-text value="→" position="4.3 0.95 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
            <a-text value="→" position="6.2 0.95 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
            <a-text value="→" position="8.1 0.95 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>
            <a-text value="→" position="10 0.95 0" rotation="-90 0 0" align="center" width="2" color="#FFFFFF"></a-text>

        </a-marker>

        <!-- CAMERA -->
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
