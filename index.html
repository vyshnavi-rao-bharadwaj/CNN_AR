<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNN Image Processing - AR TLM</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #050510;
        }

        #title {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 92%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.85);
            color: #00FFCC;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #00FFCC;
            text-align: center;
            font-size: 15px;
        }

        #instruction {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 90%;
            max-width: 450px;
            background: rgba(20, 20, 35, 0.9);
            color: #FFFFFF;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #555588;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div id="title">
        <b>CNN IMAGE PROCESSING PIPELINE</b><br>
        <span style="color: #FFFFFF; font-size: 12px;">Drag screen left/right to navigate steps</span>
    </div>

    <div id="instruction">
        <b>Data Flow:</b> Watch yellow particles pass data between CNN stages
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="antialias: true; logarithmicDepthBuffer: true;">
        
        <!-- CAMERA POSITIONED TO VIEW FULL FLOW -->
        <a-entity camera look-controls position="3.9 1 6.5"></a-entity>
        <a-sky color="#0A0A1A"></a-sky>

        <!-- MAIN MODEL CONTAINER -->
        <a-entity id="cnnModel" position="0 0 0">

            <!-- MAIN TITLE PANEL -->
            <a-plane position="3.9 3.2 0" width="6.5" height="0.8" color="#111122" material="opacity: 0.9;"></a-plane>
            <a-text value="HOW CNN PROCESSES AN IMAGE" position="3.9 3.2 0.05" align="center" width="6.5" color="#00FFCC"></a-text>

            <!-- ================================================= -->
            <!-- STEP 1 : INPUT IMAGE -->
            <!-- ================================================= -->
            <a-plane position="-3 2.1 0" width="2.2" height="0.5" color="#000000"></a-plane>
            <a-text value="1. INPUT IMAGE" position="-3 2.1 0.05" align="center" width="3.2" color="#00FFFF"></a-text>
            
            <a-plane position="-3 0.9 0" width="1.8" height="1.8" color="#1A1A1A"></a-plane>
            <a-entity id="inputPixels">
                <!-- Row 1 -->
                <a-box position="-3.6 1.4 0.03" width="0.45" height="0.45" depth="0.04" color="#FFFFFF"></a-box>
                <a-box position="-3.15 1.4 0.03" width="0.45" height="0.45" depth="0.04" color="#AAAAAA"></a-box>
                <a-box position="-2.7 1.4 0.03" width="0.45" height="0.45" depth="0.04" color="#555555"></a-box>
                <!-- Row 2 -->
                <a-box position="-3.6 0.95 0.03" width="0.45" height="0.45" depth="0.04" color="#CCCCCC"></a-box>
                <a-box position="-3.15 0.95 0.03" width="0.45" height="0.45" depth="0.04" color="#FFFFFF"></a-box>
                <a-box position="-2.7 0.95 0.03" width="0.45" height="0.45" depth="0.04" color="#777777"></a-box>
                <!-- Row 3 -->
                <a-box position="-3.6 0.5 0.03" width="0.45" height="0.45" depth="0.04" color="#444444"></a-box>
                <a-box position="-3.15 0.5 0.03" width="0.45" height="0.45" depth="0.04" color="#999999"></a-box>
                <a-box position="-2.7 0.5 0.03" width="0.45" height="0.45" depth="0.04" color="#FFFFFF"></a-box>
            </a-entity>
            <a-plane position="-3 -0.2 0" width="2" height="0.4" color="#000000"></a-plane>
            <a-text value="Raw Pixel Grid" position="-3 -0.2 0.05" align="center" width="2.2" color="#FFFFFF"></a-text>

            <!-- FLOW PARTICLE 1 -> 2 -->
            <a-sphere radius="0.08" color="#FFFF00" position="-2 0.95 0"
                      animation="property: position; from: -2.1 0.95 0; to: -1.8 0.95 0; dir: normal; loop: true; dur: 800; easing: linear;"></a-sphere>

            <!-- ================================================= -->
            <!-- STEP 2 : PRE-PROCESSING -->
            <!-- ================================================= -->
            <a-plane position="-1 2.1 0" width="2.2" height="0.5" color="#000000"></a-plane>
            <a-text value="2. PRE-PROCESS" position="-1 2.1 0.05" align="center" width="3.2" color="#FFD700"></a-text>

            <a-box position="-1 0.95 0" width="1.5" height="1.5" depth="0.12" color="#333333"></a-box>
            <a-text value="Resize Image\n\nNormalize Values\n\nRemove Noise" position="-1 0.95 0.1" align="center" width="1.8" color="#FFFFFF"></a-text>

            <!-- FLOW PARTICLE 2 -> 3 -->
            <a-sphere radius="0.08" color="#FFFF00" position="0 0.95 0"
                      animation="property: position; from: -0.1 0.95 0; to: 0.3 0.95 0; dir: normal; loop: true; dur: 800; easing: linear;"></a-sphere>

            <!-- ================================================= -->
            <!-- STEP 3 : CONVOLUTION -->
            <!-- ================================================= -->
            <a-plane position="1.2 2.1 0" width="2.2" height="0.5" color="#000000"></a-plane>
            <a-text value="3. CONVOLUTION" position="1.2 2.1 0.05" align="center" width="3.2" color="#FF66CC"></a-text>

            <a-plane position="0.6 0.9 0" width="1.5" height="1.5" color="#222222"></a-plane>
            <!-- Moving Kernel scanning filter -->
            <a-plane position="1.8 0.9 0.08" width="0.9" height="0.9" color="#FF3366"
                     animation="property: position; from: 1.8 1.35 0.08; to: 1.8 0.45 0.08; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine;"></a-plane>
            
            <a-plane position="1.2 -0.2 0" width="2" height="0.4" color="#000000"></a-plane>
            <a-text value="3x3 Filter Scanning" position="1.2 -0.2 0.05" align="center" width="2" color="#FF66CC"></a-text>

            <!-- FLOW PARTICLE 3 -> 4 -->
            <a-sphere radius="0.08" color="#FFFF00" position="2.4 0.95 0"
                      animation="property: position; from: 2.3 0.95 0; to: 2.7 0.95 0; dir: normal; loop: true; dur: 800; easing: linear;"></a-sphere>

            <!-- ================================================= -->
            <!-- STEP 4 : FEATURE MAP -->
            <!-- ================================================= -->
            <a-plane position="3.3 2.1 0" width="2.2" height="0.5" color="#000000"></a-plane>
            <a-text value="4. FEATURE MAP" position="3.3 2.1 0.05" align="center" width="3.2" color="#00FF88"></a-text>

            <a-plane position="3.3 0.9 0" width="1.5" height="1.5" color="#002211"></a-plane>
            <a-box position="2.95 1.3 0.08" width="0.35" height="0.35" depth="0.05" color="#00FF88"></a-box>
            <a-box position="3.3 1.3 0.08" width="0.35" height="0.35" depth="0.05" color="#00FF88"></a-box>
            <a-box position="3.65 1.3 0.08" width="0.35" height="0.35" depth="0.05" color="#003322"></a-box>
            <a-box position="2.95 0.95 0.08" width="0.35" height="0.35" depth="0.05" color="#00FF88"></a-box>
            
            <a-plane position="3.3 -0.2 0" width="2" height="0.4" color="#000000"></a-plane>
            <a-text value="Extracted Edges" position="3.3 -0.2 0.05" align="center" width="2" color="#00FF88"></a-text>

            <!-- FLOW PARTICLE 4 -> 5 -->
            <a-sphere radius="0.08" color="#FFFF00" position="4.3 0.95 0"
                      animation="property: position; from: 4.1 0.95 0; to: 4.5 0.95 0; dir: normal; loop: true; dur: 800; easing: linear;"></a-sphere>

            <!-- ================================================= -->
            <!-- STEP 5 : POOLING -->
            <!-- ================================================= -->
            <a-plane position="5.3 2.1 0" width="2.2" height="0.5" color="#000000"></a-plane>
            <a-text value="5. POOLING" position="5.3 2.1 0.05" align="center" width="3.2" color="#FFA500"></a-text>

            <a-plane position="5.3 0.95 0" width="1.3" height="1.3" color="#331100"></a-plane>
            <a-text value="MAX POOL\n\nShrinks Size" position="5.3 0.95 0.1" align="center" width="1.8" color="#FFFFFF"></a-text>

            <!-- FLOW PARTICLE 5 -> 6 -->
            <a-sphere radius="0.08" color="#FFFF00" position="6.2 0.95 0"
                      animation="property: position; from: 6.0 0.95 0; to: 6.4 0.95 0; dir: normal; loop: true; dur: 800; easing: linear;"></a-sphere>

            <!-- ================================================= -->
            <!-- STEP 6 : FLATTEN -->
            <!-- ================================================= -->
            <a-plane position="7.1 2.1 0" width="2.2" height="0.5" color="#000000"></a-plane>
            <a-text value="6. FLATTEN" position="7.1 2.1 0.05" align="center" width="3.2" color="#BB88FF"></a-text>

            <a-box position="6.8 0.95 0" width="0.25" height="1.5" depth="0.15" color="#BB88FF"
                   animation="property: rotation; to: 0 0 360; loop: true; dur: 4000; easing: linear;"></a-box>
            
            <a-plane position="7.1 -0.2 0" width="2.2" height="0.4" color="#000000"></a-plane>
            <a-text value="2D Map -> 1D Vector" position="7.1 -0.2 0.05" align="center" width="2.2" color="#BB88FF"></a-text>

            <!-- FLOW PARTICLE 6 -> 7 -->
            <a-sphere radius="0.08" color="#FFFF00" position="8.1 0.95 0"
                      animation="property: position; from: 7.9 0.95 0; to: 8.3 0.95 0; dir: normal; loop: true; dur: 800; easing: linear;"></a-sphere>

            <!-- ================================================= -->
            <!-- STEP 7 : NEURAL NETWORK CLASSIFIER -->
            <!-- ================================================= -->
            <a-plane position="9.2 2.1 0" width="2.2" height="0.5" color="#000000"></a-plane>
            <a-text value="7. NEURAL NET" position="9.2 2.1 0.05" align="center" width="3.2" color="#FFFFFF"></a-text>

            <!-- Neurons -->
            <a-sphere position="8.7 1.15 0" radius="0.16" color="#00FFCC"></a-sphere>
            <a-sphere position="8.7 0.65 0" radius="0.16" color="#00FFCC"></a-sphere>
            <a-sphere position="9.5 1.15 0" radius="0.16" color="#FF00CC"></a-sphere>
            <a-sphere position="9.5 0.65 0" radius="0.16" color="#FF00CC"></a-sphere>

            <!-- Synapses -->
            <a-entity line="start: 8.7 1.15 0; end: 9.5 1.15 0; color: #00FFCC"></a-entity>
            <a-entity line="start: 8.7 1.15 0; end: 9.5 0.65 0; color: #00FFCC"></a-entity>
            <a-entity line="start: 8.7 0.65 0; end: 9.5 1.15 0; color: #00FFCC"></a-entity>
            <a-entity line="start: 8.7 0.65 0; end: 9.5 0.65 0; color: #00FFCC"></a-entity>

            <!-- FLOW PARTICLE 7 -> 8 -->
            <a-sphere radius="0.08" color="#FFFF00" position="10 0.95 0"
                      animation="property: position; from: 9.8 0.95 0; to: 10.2 0.95 0; dir: normal; loop: true; dur: 800; easing: linear;"></a-sphere>

            <!-- ================================================= -->
            <!-- STEP 8 : FINAL PREDICTION -->
            <!-- ================================================= -->
            <a-plane position="10.8 2.1 0" width="2.2" height="0.5" color="#000000"></a-plane>
            <a-text value="8. OUTPUT" position="10.8 2.1 0.05" align="center" width="3.2" color="#00FFFF"></a-text>

            <a-cylinder position="10.8 0.9 0" radius="0.65" height="0.15" rotation="90 0 0" color="#00AAFF"
                        animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000;"></a-cylinder>
            <a-text value="CAT\n92% Match" position="10.8 0.9 0.15" align="center" width="2.2" color="#FFFFFF"></a-text>

            <a-plane position="10.8 -0.2 0" width="2" height="0.4" color="#000000"></a-plane>
            <a-text value="Final Classification" position="10.8 -0.2 0.05" align="center" width="2" color="#00FFFF"></a-text>

        </a-entity>
    </a-scene>

</body>
</html>
